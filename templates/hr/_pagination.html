{% if is_paginated %}
  <nav class="pagination">
    {% if page_obj.has_previous %}<a href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.previous_page_number }}">&larr; Poprzednia</a>{% endif %}
    <span>Strona {{ page_obj.number }} z {{ paginator.num_pages }}</span>
    {% if page_obj.has_next %}<a href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.next_page_number }}">Następna &rarr;</a>{% endif %}
  </nav>
{% endif %}
