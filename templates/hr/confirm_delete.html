{% extends 'hr/base_hr.html' %}
{% block hr_title %}Usuwanie{% endblock %}
{% block hr_content %}
<div class="card">
  <h1>Usunąć „{{ object }}”?</h1>
  <p>Tej operacji nie można cofnąć.</p>
  <form method="post" class="actions">
    {% csrf_token %}
    <button type="submit" class="btn btn--danger">Tak, usuń</button>
    <a href="{{ object.get_absolute_url }}" class="btn btn--ghost">Anuluj</a>
  </form>
</div>
{% endblock %}
