{% extends 'base.html' %}
{% block title %}Logowanie | HR Service{% endblock %}
{% block content %}
<div class="auth-box">
  <h1>Logowanie</h1>
  <form method="post" class="form">
    {% csrf_token %}
    {% include 'partials/form.html' %}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn">Zaloguj</button>
  </form>
  <p><a href="{% url 'password_reset' %}">Nie pamiętasz hasła?</a></p>
  <p class="muted small">Nie masz konta? Konta zakłada dział IT — skontaktuj się z administratorem.</p>
</div>
{% endblock %}
