{% extends 'base.html' %}
{% block title %}Rejestracja | HR Service{% endblock %}
{% block content %}
<div class="auth-box">
  <h1>Rejestracja</h1>
  <form method="post" class="form">
    {% csrf_token %}
    {% include 'partials/form.html' %}
    <button type="submit" class="btn">Utwórz konto</button>
  </form>
  <p>Masz już konto? <a href="{% url 'login' %}">Zaloguj się</a></p>
</div>
{% endblock %}
